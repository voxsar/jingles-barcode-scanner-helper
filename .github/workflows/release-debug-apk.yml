name: Release debug APK

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Prepare release asset
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          APK_NAME="${REPOSITORY_NAME}-${TAG_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "APK_PATH=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload debug APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${APK_PATH}" --clobber
