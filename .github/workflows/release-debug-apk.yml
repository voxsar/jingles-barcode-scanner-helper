name: Release debug APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to upload the APK to (e.g. v1.0.0)'
        required: true
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Prepare release asset
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          TAG_NAME: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
        run: |
          APK_NAME="${REPOSITORY_NAME}-${TAG_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "APK_PATH=$APK_NAME" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${TAG_NAME}" > /dev/null 2>&1; then
            gh release create "${TAG_NAME}" --title "${TAG_NAME}" --target "${GITHUB_SHA}" --notes "Automated debug APK upload."
          fi

      - name: Upload debug APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG_NAME}" "${APK_PATH}" --clobber
